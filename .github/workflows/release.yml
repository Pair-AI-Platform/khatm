name: Release

# Every merge to main that changes the packages publishes a new version (see build.yml), creates a
# GitHub release with its CHANGELOG.md entry, and keeps only the five newest versions, in GHCR and
# as GitHub releases. Every job can be re-run: a failed release resumes where it stopped.
on:
  push:
    branches:
      - main
    paths:
      - 'melange/**'
      - 'scripts/publish.sh'
      - '.github/workflows/build.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

# Releases run one after another, never in parallel or cancelled half-way
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      publish: true
    secrets: inherit

  # Also runs when the tag already existed, so a re-run creates a release that a failed run missed
  release:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ needs.build.outputs.tag }}
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Cryptographic Inventories
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      # The release creates the git tag on the commit the packages were built from. When main has
      # moved on and its workflow files differ from that commit, GitHub treats the new tag as a
      # workflow change, which GITHUB_TOKEN may never make (HTTP 403). The repository's GitHub App
      # has the workflows permission, so its short-lived token is used instead.
      - name: App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openssl-provider-fips"
          {
            awk -v tag="$TAG" '
              $0 ~ "^## " tag " " {found = 1; next}
              found && /^## / {exit}
              found {print}
            ' CHANGELOG.md
            cat <<EOF

          ### Artifact

          \`$image:$TAG\` (\`$DIGEST\`)

          \`\`\`sh
          oras pull $image:$TAG --platform linux/amd64   # or linux/arm64
          gh attestation verify oci://$image:$TAG --repo $GITHUB_REPOSITORY \\
            --signer-workflow $GITHUB_REPOSITORY/.github/workflows/build.yml
          \`\`\`
          EOF
          } > notes.md
          cat notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::GitHub release $TAG already exists"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md \
              dist/crypto-inventory-*.json
          fi

  # Keeps the five newest versions and nothing else. In GHCR only the release tags (<version>-r<epoch>)
  # are counted, so `latest` and the sha256-* referrer tags never push a version out; a kept version
  # keeps its platform manifests and referrers (signatures, SBOMs, provenance), and untagged
  # leftovers of failed runs are deleted. GitHub releases and their git tags follow the same rule.
  # Never fails the release.
  cleanup:
    needs: [build, release]
    # Runs after a failed release step too: the versions in GHCR are complete either way
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: write
      packages: write
    steps:
      - name: Keep the Five Newest Versions in GHCR
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: openssl-provider-fips
          use-regex: true
          delete-tags: '^[0-9]+\.[0-9]+\.[0-9]+-r[0-9]+$'
          keep-n-tagged: 5
          delete-untagged: true
          delete-orphaned-images: true
          delete-partial-images: true
          validate: true

      # Deleting an old tag counts as a workflow change too when its workflow files differ from main
      - name: App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Keep the Five Newest GitHub Releases
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq 'map(select(.tagName | test("^[0-9]+\\.[0-9]+\\.[0-9]+-r[0-9]+$")))
                  | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r tag; do
            echo "deleting release and tag $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
