name: Build

# Reusable workflow: builds and tests the melange packages natively on x86_64 and aarch64 and, when
# `publish` is set, pushes them to GHCR as one multi-platform OCI artifact with its signature, SBOMs
# and SLSA provenance attached as OCI 1.1 referrers.
#
# SLSA Build Level 3: the packages are built, signed and attested inside this one reusable
# workflow, on ephemeral GitHub-hosted runners. The signatures and the provenance carry this
# workflow's identity (the OIDC job_workflow_ref claim), not the caller's; the caller only passes
# `publish` and cannot run steps in these jobs or reach their OIDC token. Verify with:
#
#   gh attestation verify oci://ghcr.io/<owner>/openssl-provider-fips:<tag> \
#     --repo <owner>/<repo> --signer-workflow <owner>/<repo>/.github/workflows/build.yml
on:
  workflow_call:
    inputs:
      publish:
        description: Push, sign and attest the packages
        type: boolean
        default: false
    outputs:
      tag:
        description: The release tag (<version>-r<epoch>)
        value: ${{ jobs.build.outputs.tag }}
      published:
        description: "'true' when this run published a new release, 'false' when it already existed"
        value: ${{ jobs.publish.outputs.published }}
      digest:
        description: Digest of the published image index
        value: ${{ jobs.publish.outputs.digest }}

permissions: {}

env:
  # Pinned by digest; Renovate updates it with the Wolfi packages (renovate.json)
  MELANGE_IMAGE: cgr.dev/chainguard/melange:latest@sha256:b17c529b3473825e4b682cc2fa0384bd347cda8c7f1f56e6d432e686a4440749
  CONFIG: melange/openssl-provider-fips-3.1.2.yaml
  SOURCE_DIR: melange/openssl-provider-fips-3.1.2
  PACKAGE: openssl-provider-fips

jobs:
  # Native runner per architecture, no QEMU
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: version
        run: |
          version="$(awk -F'"' '/^  version:/ {print $2; exit}' "$CONFIG")"
          epoch="$(awk '/^  epoch:/ {print $2; exit}' "$CONFIG")"
          echo "tag=$version-r$epoch" >> "$GITHUB_OUTPUT"

      # APK signatures need an RSA key: the MELANGE_SIGNING_KEY secret, whose public half is committed
      # as keys/khatm.rsa.pub so users can check the packages against it. Runs without the secret
      # (pull requests from forks) sign with a throwaway key instead.
      - name: Signing Key
        env:
          SIGNING_KEY: ${{ secrets.MELANGE_SIGNING_KEY }}
        run: |
          mkdir -p .keys
          if [ -n "$SIGNING_KEY" ]; then
            name=khatm.rsa
            (umask 077; printf '%s\n' "$SIGNING_KEY" > ".keys/$name")
            cp "keys/$name.pub" ".keys/$name.pub"
            # The secret must be the private half of the published public key
            openssl pkey -in ".keys/$name" -pubout | diff -q - ".keys/$name.pub"
          elif [ "${{ inputs.publish }}" = true ]; then
            echo "::error::Releases need the MELANGE_SIGNING_KEY secret"
            exit 1
          else
            name="melange-${{ matrix.arch }}.rsa"
            docker run --rm -v "$PWD/.keys":/keys -w /keys "$MELANGE_IMAGE" keygen "$name"
          fi
          echo "KEY_NAME=$name" >> "$GITHUB_ENV"

      - name: Build
        run: |
          docker run --rm --privileged -v "$PWD":/work -w /work "$MELANGE_IMAGE" build "$CONFIG" \
            --arch "${{ matrix.arch }}" \
            --source-dir "$SOURCE_DIR" \
            --signing-key ".keys/$KEY_NAME" \
            --out-dir packages \
            --namespace pair-ai-platform \
            --license Apache-2.0
          sudo chown -R "$(id -u):$(id -g)" packages .keys
          ls -l "packages/${{ matrix.arch }}"

      # The package tests: provider loads with Wolfi's OpenSSL 3, approved algorithms work,
      # unapproved ones are refused, a tampered integrity MAC stops the module from loading
      - name: Test
        run: |
          docker run --rm --privileged -v "$PWD":/work -w /work "$MELANGE_IMAGE" test "$CONFIG" \
            --arch "${{ matrix.arch }}" \
            --source-dir "$SOURCE_DIR" \
            --repository-append /work/packages \
            --keyring-append "/work/.keys/$KEY_NAME.pub"

      - name: Collect
        run: |
          mkdir -p dist
          cp -r "packages/${{ matrix.arch }}" dist/
          cp ".keys/$KEY_NAME.pub" dist/
          rm -rf .keys

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.arch }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      published: ${{ steps.check.outputs.published }}
      digest: ${{ steps.push.outputs.digest || steps.check.outputs.digest }}
    env:
      TAG: ${{ needs.build.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install oras
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          # renovate: datasource=github-releases depName=oras-project/oras
          version: 1.3.6

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # renovate: datasource=github-releases depName=sigstore/cosign
          cosign-release: v3.1.4

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$PACKAGE" >> "$GITHUB_ENV"
          printf '%s' "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GH_TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # A release tag is immutable: if it exists, nothing is pushed. Changing the packages needs a new
      # epoch in the melange file, which pr.yml enforces. Because the tag is created only after the
      # evidence is verified (last step), an existing tag is always a complete release; a re-run
      # after a failure in between only makes sure `latest` points at it.
      - name: Check Tag
        id: check
        run: |
          if digest="$(oras resolve "$IMAGE:$TAG" 2>/dev/null)"; then
            echo "::notice::$IMAGE:$TAG is already published; nothing to release"
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            if [ "$(oras resolve "$IMAGE:latest" 2>/dev/null || true)" != "$digest" ]; then
              oras tag "$IMAGE@$digest" latest
            fi
          else
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download
        if: steps.check.outputs.published == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Push
        id: push
        if: steps.check.outputs.published == 'true'
        run: |
          ls -lR dist
          digest="$(scripts/publish.sh "$IMAGE" "$TAG" dist)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          oras manifest fetch "$IMAGE@$digest" | jq -r '.manifests[] | "\(.platform.architecture) \(.digest)"' > platforms.txt
          cat platforms.txt

      # Keyless: the certificate is issued to this workflow's identity by Sigstore Fulcio and the
      # signature is logged in Rekor. --recursive signs the index and each platform manifest.
      - name: Sign
        if: steps.check.outputs.published == 'true'
        run: cosign sign --yes --recursive "$IMAGE@${{ steps.push.outputs.digest }}"

      # The SPDX SBOM melange writes into each package, attested on the manifest of its platform
      - name: Attest SBOMs
        if: steps.check.outputs.published == 'true'
        run: |
          declare -A dir=([amd64]=x86_64 [arm64]=aarch64)
          while read -r arch digest; do
            for apk in "dist/${dir[$arch]}"/*.apk; do
              sbom="$(mktemp -d)"
              tar -xzf "$apk" -C "$sbom" var/lib/db/sbom
              for f in "$sbom"/var/lib/db/sbom/*.spdx.json; do
                echo "$arch: $(basename "$f")"
                cosign attest --yes --type spdxjson --predicate "$f" "$IMAGE@$digest"
              done
              rm -rf "$sbom"
            done
          done < platforms.txt

      - name: Attest Provenance (OCI)
        if: steps.check.outputs.published == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # The same provenance for each .apk file, for users who download the packages directly
      - name: Attest Provenance (APK files)
        if: steps.check.outputs.published == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*/*.apk

      # Fails the release before anything is tagged if any evidence above is missing
      - name: Verify
        if: steps.check.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          identity="^https://github.com/$GITHUB_REPOSITORY/.github/workflows/build.yml@"
          issuer=https://token.actions.githubusercontent.com
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" >/dev/null
          while read -r _ digest; do
            cosign verify "$IMAGE@$digest" \
              --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" >/dev/null
            cosign verify-attestation --type spdxjson "$IMAGE@$digest" \
              --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" >/dev/null
          done < platforms.txt
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml"
          for apk in dist/*/*.apk; do
            gh attestation verify "$apk" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml"
          done
          oras discover --format tree "$IMAGE@$DIGEST"

      # Last step: the release tag and `latest` appear only now, on a verified digest. A run that fails
      # earlier leaves untagged manifests only, which release.yml's cleanup deletes.
      - name: Tag
        if: steps.check.outputs.published == 'true'
        run: oras tag "$IMAGE@${{ steps.push.outputs.digest }}" "$TAG" latest
