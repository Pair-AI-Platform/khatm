name: PR

# The checks every pull request needs before it merges, including Renovate's automerge: the
# packages build and pass their tests on both architectures, and a change to the packages comes
# with a new, unreleased version and a CHANGELOG entry for it.
on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      publish: false
    secrets: inherit

  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install oras
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          # renovate: datasource=github-releases depName=oras-project/oras
          version: 1.3.6

      # Released tags are never rebuilt: a change to the packages needs a new epoch
      - name: New Version and Changelog
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          config=melange/openssl-provider-fips-3.1.2.yaml
          if git diff --quiet "$BASE_SHA" HEAD -- melange/; then
            echo "The packages do not change"
            exit 0
          fi
          version="$(awk -F'"' '/^  version:/ {print $2; exit}' "$config")"
          epoch="$(awk '/^  epoch:/ {print $2; exit}' "$config")"
          tag="$version-r$epoch"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openssl-provider-fips"
          printf '%s' "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if oras manifest fetch --descriptor "$image:$tag" >/dev/null 2>&1; then
            echo "::error file=$config::$tag is already released; bump the epoch"
            exit 1
          fi
          if ! grep -q "^## $tag " CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::No CHANGELOG.md entry for $tag"
            exit 1
          fi
          echo "$tag is a new version with a changelog entry"
